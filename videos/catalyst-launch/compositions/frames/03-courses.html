<template>

    #launch-03-topbar {

    .launch-03-panel {
      position: absolute;

      overflow: hidden;
      border: 2px solid #315c47;
      border-radius: 8px;
      background: #f6f7f0;
    }
    .launch-03-panel img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 0%;
    }
    /* Both source plates are 1265×712. The 1196×686 inner panel keeps
       the full source height and crops approximately 11.85 px per side.
       No reconstructed app elements, blur, stretch, or cosmetic filters. */
    #launch-03-title {
      position: absolute;
      left: 96px;
      top: 231px;
      width: 476px;
      margin: 0;
      font-size: 4.4cqw;
      font-weight: 500;
      line-height: 1;
      letter-spacing: -.02em;
    }
    #launch-03-choice {
      position: absolute;
      left: 96px;

      font-size: 1.56cqw;
      font-weight: 400;
      line-height: 1.38;
    }
    .launch-03-range {
      position: absolute;
      left: 96px;
      width: 476px;
      margin: 0;
      font-size: 4.4cqw;
      font-weight: 500;
      line-height: 1;
      letter-spacing: -.02em;

    #launch-03-counting { top: 246px; }

    #launch-03-college span {

  <div id="root" data-composition-id="launch-03" data-width="1920" data-height="1080" data-duration="8.83333333">
    <div id="launch-03-ground" class="clip launch-03-layer" data-start="0" data-duration="8.83333333" data-track-index="0"></div>

      <div id="launch-03-top-rule"></div>
    </div>

    <div id="clip-03-courses-clip-2" class="clip launch-03-layer" data-start="0" data-duration="3.4" data-track-index="2">

  </div>

  <script src="assets/gsap.min.js"></script>
  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="launch-03"]');
      const q = selector => root.querySelector(selector);
      const tl = gsap.timeline({ paused: true });
      // Installed soft-blur-in's 28px rise and power3.out easing, adapted
      // to opacity + translation only so the real screenshots stay sharp.
      tl.fromTo(q('#launch-03-title'),
        { opacity: 0, y: 28 },
        { opacity: 1, y: 0, duration: .8, ease: 'power3.out' }, .04);
      tl.fromTo(q('#launch-03-home-panel'),
        { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: .8, ease: 'power3.out' }, .08);
      tl.fromTo(q('#launch-03-choice'),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: .65, ease: 'power3.out' }, 1.45);

      // The two timed scene layers make the clean screenshot cut at 3.4s.
      // Supporting labels continue to arrive through the narrated second beat.
      tl.fromTo(q('#launch-03-counting'),
        { opacity: 0, y: 28 },
        { opacity: 1, y: 0, duration: .75, ease: 'power3.out' }, 3.62);
      tl.fromTo(q('#launch-03-college'),
        { opacity: 0, y: 28 },
        { opacity: 1, y: 0, duration: .75, ease: 'power3.out' }, 4.65);
      tl.fromTo(q('#launch-03-stat'),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: .75, ease: 'power3.out' }, 6.05);
      tl.fromTo(q('#launch-03-stat-label'),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: .7, ease: 'power3.out' }, 6.82);

      window.__timelines = window.__timelines || {};
      window.__timelines['launch-03'] = tl;
    })();
  </script>
